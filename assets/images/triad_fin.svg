<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 620" width="100%" height="100%" class="triad-fin-svg" aria-label="Triad Dorsal Fin: Orca on top, Fishermen on left, Tuna on right">
    <defs>
        <!-- Gradients -->
        <!-- Orca (Top) Gradient: Deep obsidian to bioluminescent teal/emerald -->
        <linearGradient id="orcaGrad" x1="0%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#041527" />
            <stop offset="60%" stop-color="#0b2b3f" />
            <stop offset="100%" stop-color="#083e47" />
        </linearGradient>

        <!-- Fishermen (Left) Gradient: Weathered wood / deep nautical bronze to warm gold -->
        <linearGradient id="fishermenGrad" x1="0%" y1="30%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141f2c" />
            <stop offset="50%" stop-color="#242833" />
            <stop offset="100%" stop-color="#3d3023" />
        </linearGradient>

        <!-- Tuna (Right) Gradient: Midnight oceanic blue to deep ruby/tuna red glow -->
        <linearGradient id="tunaGrad" x1="0%" y1="20%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#112240" />
            <stop offset="60%" stop-color="#1d2e56" />
            <stop offset="100%" stop-color="#3d1e2f" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="glowOrca" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06d6a0" flood-opacity="0.45" />
        </filter>
        <filter id="glowFishermen" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f4a261" flood-opacity="0.45" />
        </filter>
        <filter id="glowTuna" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#64b5f6" flood-opacity="0.45" />
        </filter>
        <filter id="glowCenter" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#64b5f6" flood-opacity="0.6" />
        </filter>

        <style>
            .fin-segment {
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease, opacity 0.3s ease;
                cursor: pointer;
            }
            .fin-segment:hover {
                filter: brightness(1.18);
            }
            .fin-segment:hover .segment-border {
                stroke-width: 2.5px;
            }
            .fin-label-title {
                font-family: 'Playfair Display', Georgia, serif;
                font-weight: 700;
                letter-spacing: 0.12em;
            }
            .fin-label-sub {
                font-family: 'JetBrains Mono', monospace;
                font-size: 10px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
            }
            .icon-glyph {
                pointer-events: none;
            }
        </style>
    </defs>

    <!-- Background Subtle Halo -->
    <ellipse cx="270" cy="330" rx="200" ry="220" fill="radial-gradient(circle, rgba(10,25,47,0.8) 0%, rgba(2,12,27,0) 70%)" opacity="0.6" />

    <!-- Outer Fin Silhouette Outline (Underlayer Guide) -->
    <path d="M 100,520 
             C 120,420 180,260 250,120 
             C 265,90 280,60 295,45 
             C 305,35 318,42 322,58 
             C 310,130 295,230 305,330 
             C 318,420 370,480 440,520 
             C 330,535 210,535 100,520 Z"
          fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6" />

    <!-- ========================================================
         1. TOP PART: ORCA (Apex Predator)
         ======================================================== -->
    <g class="fin-segment segment-orca" id="segment-orca">
        <path class="segment-shape"
              d="M 200,230 
                 C 230,160 265,90 295,45 
                 C 305,35 318,42 322,58 
                 C 310,130 295,210 302,280 
                 C 290,282 280,281 270,280 
                 C 245,260 220,245 200,230 Z"
              fill="url(#orcaGrad)" />
        
        <path class="segment-border"
              d="M 200,230 
                 C 230,160 265,90 295,45 
                 C 305,35 318,42 322,58 
                 C 310,130 295,210 302,280 
                 C 290,282 280,281 270,280 
                 C 245,260 220,245 200,230 Z"
              fill="none" stroke="#06d6a0" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round" />

        <!-- Interior Detail: Orca Eye-Patch & Dorsal Motif -->
        <g class="icon-glyph" transform="translate(255, 95)">
            <!-- Stylized Orca Eye Patch (White oval) -->
            <path d="M 0,22 C 8,16 22,14 32,20 C 38,24 35,32 25,32 C 14,32 4,28 0,22 Z"
                  fill="#ffffff" opacity="0.9" filter="drop-shadow(0 0 4px rgba(255,255,255,0.6))" />
            <!-- Orca Tail / Swirl Graphic -->
            <path d="M -15,48 C 5,42 25,48 40,65" fill="none" stroke="#06d6a0" stroke-width="2" stroke-linecap="round" opacity="0.7" />
        </g>

        <!-- Text Label for Orca -->
        <text x="272" y="195" text-anchor="middle" fill="#e6f1ff" font-size="16" class="fin-label-title">ORCA</text>
        <text x="272" y="212" text-anchor="middle" fill="#06d6a0" class="fin-label-sub">APEX HUNTER</text>
    </g>

    <!-- ========================================================
         2. BOTTOM-LEFT PART: FISHERMEN (Artisanal Fleet)
         ======================================================== -->
    <g class="fin-segment segment-fishermen" id="segment-fishermen">
        <path class="segment-shape"
              d="M 200,230 
                 C 220,245 245,260 270,280 
                 C 275,360 272,450 270,532 
                 C 210,534 140,530 100,520 
                 C 120,420 160,310 200,230 Z"
              fill="url(#fishermenGrad)" />

        <path class="segment-border"
              d="M 200,230 
                 C 220,245 245,260 270,280 
                 C 275,360 272,450 270,532 
                 C 210,534 140,530 100,520 
                 C 120,420 160,310 200,230 Z"
              fill="none" stroke="#f4a261" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round" />

        <!-- Interior Detail: Fishermen Boat & Drop-line Hook Motif -->
        <g class="icon-glyph" transform="translate(145, 330)">
            <!-- Artisanal Wooden Boat Silhouette -->
            <path d="M 0,30 C 15,30 45,32 55,20 C 45,36 15,38 -8,36 C -18,34 -25,28 -30,22 C -18,28 -8,30 0,30 Z"
                  fill="#f4a261" opacity="0.85" />
            <!-- Fisherman Silhouette on Boat -->
            <path d="M 12,20 C 12,14 16,10 22,10 C 26,10 29,13 29,17 C 27,24 16,25 12,20 Z"
                  fill="#e9c46a" opacity="0.9" />
            <path d="M 24,19 L 34,27" stroke="#e9c46a" stroke-width="1.8" stroke-linecap="round" />
            <!-- Vertical Drop-line (Pesca de la piedra) -->
            <line x1="34" y1="27" x2="34" y2="78" stroke="#f4a261" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8" />
            <!-- Stone Weight Sinkers -->
            <polygon points="34,78 30,86 38,86" fill="#e9c46a" opacity="0.9" />
            <!-- Deep Baited Hooks -->
            <path d="M 34,62 C 40,62 44,66 40,70 C 37,73 34,70 34,68" fill="none" stroke="#f4a261" stroke-width="1.5" stroke-linecap="round" />
        </g>

        <!-- Text Label for Fishermen -->
        <text x="185" y="455" text-anchor="middle" fill="#e6f1ff" font-size="16" class="fin-label-title">FISHERMEN</text>
        <text x="185" y="472" text-anchor="middle" fill="#f4a261" class="fin-label-sub">ARTISANAL FLEET</text>
    </g>

    <!-- ========================================================
         3. BOTTOM-RIGHT PART: BLUEFIN TUNA (The Ocean Titan)
         ======================================================== -->
    <g class="fin-segment segment-tuna" id="segment-tuna">
        <path class="segment-shape"
              d="M 270,280 
                 C 280,281 290,282 302,280 
                 C 312,360 365,460 440,520 
                 C 380,532 325,534 270,532 
                 C 272,450 275,360 270,280 Z"
              fill="url(#tunaGrad)" />

        <path class="segment-border"
              d="M 270,280 
                 C 280,281 290,282 302,280 
                 C 312,360 365,460 440,520 
                 C 380,532 325,534 270,532 
                 C 272,450 275,360 270,280 Z"
              fill="none" stroke="#64b5f6" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round" />

        <!-- Interior Detail: Bluefin Tuna Hydrodynamic Silhouette -->
        <g class="icon-glyph" transform="translate(325, 345)">
            <!-- Streamlined Torpedo Body -->
            <path d="M -30,25 
                     C -10,10 25,8 45,22 
                     C 60,30 75,28 85,25 
                     C 88,20 92,15 96,12 
                     C 94,22 93,28 98,38 
                     C 93,34 89,28 85,26 
                     C 70,36 40,42 10,40 
                     C -15,38 -25,32 -30,25 Z"
                  fill="#64b5f6" opacity="0.85" />
            <!-- Yellow Finlets along dorsal/anal spine -->
            <polygon points="55,14 59,9 63,14" fill="#f4a261" opacity="0.9" />
            <polygon points="66,16 70,12 74,17" fill="#f4a261" opacity="0.9" />
            <polygon points="76,19 80,15 84,21" fill="#f4a261" opacity="0.9" />
            <polygon points="58,35 62,40 66,35" fill="#f4a261" opacity="0.9" />
            <polygon points="68,33 72,37 76,32" fill="#f4a261" opacity="0.9" />
            <!-- Pectoral Fin -->
            <path d="M 0,25 C 15,28 28,38 32,45 C 24,42 12,35 0,25 Z" fill="#e63946" opacity="0.9" />
        </g>

        <!-- Text Label for Tuna -->
        <text x="350" y="455" text-anchor="middle" fill="#e6f1ff" font-size="16" class="fin-label-title">BLUEFIN TUNA</text>
        <text x="350" y="472" text-anchor="middle" fill="#64b5f6" class="fin-label-sub">OCEAN TITAN</text>
    </g>

    <!-- ========================================================
         4. CENTRAL CONVERGENCE NEXUS (Where Titans Collide)
         ======================================================== -->
    <g class="central-nexus" transform="translate(270, 280)" filter="url(#glowCenter)">
        <!-- Outer Glow Ring -->
        <circle cx="0" cy="0" r="16" fill="#0a192f" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
        <circle cx="0" cy="0" r="10" fill="#112240" stroke="#64b5f6" stroke-width="1.8" />
        <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
        
        <!-- Radiant Triad Spokes -->
        <line x1="0" y1="-10" x2="0" y2="-16" stroke="#06d6a0" stroke-width="2" />
        <line x1="-9" y1="6" x2="-14" y2="9" stroke="#f4a261" stroke-width="2" />
        <line x1="9" y1="6" x2="14" y2="9" stroke="#64b5f6" stroke-width="2" />
    </g>

    <!-- Baseline Ground Water Line Accent -->
    <path d="M 80,535 Q 270,555 460,535" fill="none" stroke="rgba(100, 181, 246, 0.2)" stroke-width="1.5" stroke-dasharray="4,6" />
</svg>
