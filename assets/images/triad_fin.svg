<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 284" width="500" height="284" fill="none" role="img" aria-labelledby="heroEmblemTitle">
  <title id="heroEmblemTitle">Minimalist maritime ink triad emblem with ORCA at the top, FISHERMEN on the left, and TUNA on the right framing a large Iberian orca dorsal fin above the Strait of Gibraltar</title>

  <!-- Minimalist Triad Frame (deep maritime ink hairlines & vertex points) -->
  <g stroke="#1f2933" stroke-linecap="round">
    <line x1="238" y1="53" x2="80" y2="218" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="262" y1="53" x2="420" y2="218" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Strait Sea Horizon / Triad Base -->
    <line x1="84" y1="226" x2="416" y2="226" stroke-width="1.95" stroke-opacity="0.9"/>
  </g>

  <!-- Triad Vertex Nodes -->
  <g fill="#1f2933" fill-opacity="0.92">
    <circle cx="250" cy="41" r="2.7"/>
    <circle cx="72" cy="226" r="2.7"/>
    <circle cx="428" cy="226" r="2.7"/>
  </g>

  <!-- Large, Commanding Surfacing Orca Back & Tall Dorsal Fin (optically centered inside triad) -->
  <path fill="#1f2933" fill-rule="evenodd" d="
    M 114 226
    C 138 213.5, 169 206.8, 190 203.8
    C 201 202, 208.5 193.5, 215.2 175.5
    C 228.5 138.5, 242 103.5, 255.2 80
    C 259 73.4, 268.5 74.3, 268.5 84.8
    C 267.5 114, 258 156.5, 263.8 193.5
    C 265.7 204, 273.3 208.8, 286.6 210.7
    C 311.3 214.5, 332.2 219.3, 352 226
    Z
    M 268.5 210.7
    C 282.8 209.8, 300.8 212.6, 318 218.8
    C 300.8 219.8, 282.8 217.8, 269.5 216
    Z
  "/>

  <!-- Subtle Strait Current Wave Lines -->
  <path d="M 152 239 C 198 244, 252 235, 306 238 C 326 239, 342 240, 356 240.5"
        stroke="#2e5a6b" stroke-width="1.25" stroke-linecap="round" stroke-opacity="0.58"/>
  <path d="M 190 250 C 226 247.5, 266 253, 302 251 C 311 250.4, 318 250, 324 249.6"
        stroke="#2e5a6b" stroke-width="0.95" stroke-linecap="round" stroke-opacity="0.36"/>

  <!-- Minimalist Triad Labels: ORCA (top), FISHERMEN (left), TUNA (right) -->
  <g fill="#2e5a6b" fill-opacity="1" font-family="'Avenir Next', 'Helvetica Neue', 'Inter', system-ui, sans-serif" font-size="23" font-weight="400" text-anchor="middle">
    <text x="250" y="24" dx="2.2" letter-spacing="4.4">ORCA</text>
    <text x="104" y="270" dx="1.8" letter-spacing="3.6">FISHERMEN</text>
    <text x="412" y="270" dx="2.0" letter-spacing="4.0">TUNA</text>
  </g>
</svg>
