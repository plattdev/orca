<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" width="360" height="205" fill="none" role="img" aria-labelledby="heroEmblemTitle">
  <title id="heroEmblemTitle">Minimalist pure-white silhouette of a surfacing Iberian orca dorsal fin above the Strait of Gibraltar</title>

  <!-- Minimalist Surfacing Orca Back & Tall Male Dorsal Fin (100% pure white #ffffff, evenodd negative-space saddle patch) -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M 56 164
    C 78 152, 108 146, 128 143
    C 138 141, 145 133, 151 116
    C 164 80, 178 46, 193 21
    C 197 14, 206 15, 206 25
    C 205 54, 196 96, 202 132
    C 204 143, 211 147, 224 149
    C 248 153, 268 158, 288 164
    Z
    M 206 149
    C 220 148, 238 151, 254 157
    C 238 158, 220 156, 207 154
    Z
  "/>

  <!-- Strait Horizon Line (pure white) -->
  <line x1="28" y1="164" x2="332" y2="164" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Minimalist Twin Exchange Wave Lines (pure white) -->
  <path d="M 58 177 C 118 182, 180 172, 242 175 C 266 176, 286 177, 302 178"
        stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.65"/>
  <path d="M 98 189 C 142 186, 188 192, 234 190 C 246 189, 255 189, 262 188"
        stroke="#ffffff" stroke-width="0.95" stroke-linecap="round" stroke-opacity="0.40"/>
